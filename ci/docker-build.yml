name: Docker Build & Python 3.11 Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-python311:
    name: Run Test Suite on Python 3.11 (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg, libass, fontconfig, nodejs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libass9 \
            libass-dev \
            nodejs \
            fontconfig \
            fonts-dejavu-core \
            fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automated test suite (18 tests)
        run: |
          python -m unittest test_job_system.py test_server_endpoints.py -v

  docker-build-verify:
    name: Build & Verify Docker Image
    needs: test-python311
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --tag viral-shorts-studio:latest \
            --file Dockerfile .

      - name: Test Container Health Check
        run: |
          # Start container in background
          docker run -d \
            --name studio-verify \
            -p 5000:5000 \
            -e ENVIRONMENT=production \
            -e PORT=5000 \
            viral-shorts-studio:latest

          # Wait for container startup and health endpoint
          echo "Waiting for studio container to initialize..."
          sleep 12

          # Verify healthcheck endpoint returns HTTP 200
          curl -f -v http://localhost:5000/api/health

          # Check container logs
          echo "=== Container Logs ==="
          docker logs studio-verify

          # Clean up
          docker stop studio-verify
          docker rm studio-verify
